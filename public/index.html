<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FractalPet - The Living Mathematical Lifeform</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        <header>
            <h1>🌀 The Fractal</h1>
            <p class="tagline">A shared mathematical lifeform, growing through collective care</p>
        </header>

        <div id="stats-panel">
            <div class="stat">
                <span class="stat-label">Today's Pets</span>
                <span class="stat-value" id="today-pets">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Total Pets</span>
                <span class="stat-value" id="total-pets">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Complexity</span>
                <span class="stat-value" id="complexity">1</span>
            </div>
            <div class="stat">
                <span class="stat-label">Age</span>
                <span class="stat-value" id="age">0 days</span>
            </div>
        </div>

        <div id="canvas-container">
            <canvas id="fractal-canvas"></canvas>
            <div id="pet-prompt">
                <p>Click to pet the fractal</p>
                <span class="pulse">✨</span>
            </div>
        </div>

        <div id="info-panel">
            <p id="status-message">Loading the fractal...</p>
            <div id="recent-activity"></div>
        </div>

        <footer>
            <p>This fractal exists because of <span id="contributor-count">0</span> people who cared.</p>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="fractal.js"></script>
    <script src="app.js"></script>
</body>
</html>
